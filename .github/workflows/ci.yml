name: CI

on:
  push:
    branches: [main]
  pull_request:

# The versions this project targets.  Both floors are load-bearing rather than
# preferences, and both were measured — see docs/CI.md:
#
#   tmux 3.6  the row protocol delimits fields with a raw US byte inside a `-F`
#             format.  tmux <= 3.5a rewrites that byte as the four characters
#             `\037`, so every row parses as ONE field, the session name comes
#             out empty, and `--list` emits nothing at all.  Measured: 3.4 -> 0
#             rows, 3.5a -> 0 rows, 3.6 -> 3 rows.  ubuntu-24.04 ships 3.4, so
#             unless tmux is built here the test job is testing an empty picker.
#   fzf 0.74  the floor the suite pins itself to (INTERDIMUX_FZF_MINOR=74).
#             ubuntu-24.04's apt fzf is 0.44, which silently turns the picker
#             suites into skips rather than failures.  Pinned at the latest
#             0.74 patch release, the one users run: 0.74.1 to 0.74.4 changed
#             how fzf draws (synchronized updates, faster non-ASCII, escape
#             sequences split across reads), and the suites read its screen.
#
# Both jobs run on ubuntu-24.04, by name: `ubuntu-latest` moves to 26.04 from
# 2026-10-19, and every image-specific number in this file is 24.04's.  26.04's
# apt tmux is 3.6a, above the floor, so the tmux build could become optional
# there; its apt fzf is 0.67.0, so the fzf download could not.  To move, add
# the new image to the tests job's `os` list first: the caches are keyed on
# it, so that leg builds everything cold and proves the recipes on it.
#
# And what runs below them, as real binaries rather than emulated:
#
#   bash 4.3  the documented floor; 3.2 (macOS) and 4.2 (RHEL 7) must be
#             refused in one line.  ubuntu-24.04's own bash is 5.2, and 5.2
#             hides what behaves differently below it: a `$` in a session name
#             was re-expanded inside `[[ -v "a[$k]" ]]` on 4.3 to 5.1 while
#             every suite passed, so all four of those run: 4.4 is RHEL 8's,
#             5.0 Ubuntu 20.04's, 5.1 Ubuntu 22.04's and RHEL 9's.  Listed as
#             the GNU tarballs are named, each the newest tarball of its
#             release (later patches come only as diffs, and 5.0 has no
#             patch-level tarball at all); each is installed under its
#             major.minor, where tests/test_bash_floor.sh looks.
#   fzf       0.40.0, the README's floor and the only release on the
#             `fzf_ge 42` false branch; 0.44.1 and 0.52.1, one per failure
#             tests/test_old_fzf.sh guards.
#
# Those two suites' own lists are the authority, not these.  With the
# directories set (below), a version a suite names that is not there FAILS the
# suite instead of skipping it, so these lists cannot fall behind unnoticed.
env:
  TMUX_VERSION: "3.7b"
  FZF_VERSION: "0.74.4"
  OLD_BASH_VERSIONS: "3.2.57 4.2.53 4.3.30 4.4.18 5.0 5.1.16"
  OLD_FZF_VERSIONS: "0.40.0 0.44.1 0.52.1"
  # The tree glyphs are multibyte and the column maths counts CELLS.  Runners do
  # not reliably set a locale, and without a UTF-8 one widths are measured in
  # bytes.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # tests/lint.sh holds both invocations, and why there are two, so the
      # lint runs on a developer's box exactly as here.  It also pins the
      # shellcheck: the image's own (0.9.0 here, 0.11.0 on 26.04) is set aside
      # and the 0.10.0 release fetched, checksummed, so an image bump cannot
      # bring in SC codes nobody has run.
      - name: Lint the plugin and the tests
        run: bash tests/lint.sh

  tests:
    name: tests (${{ matrix.renderer }} renderer)
    runs-on: ${{ matrix.os }}
    # The suites drive real tmux servers and wait on real panes.  They take ~5
    # minutes; a cap keeps a hung one from burning the job's six-hour default.
    timeout-minutes: 30
    # Two renderers ship, so both are tested.  `rust` is the developer's setup:
    # the core built, every suite on it, the parity suites comparing it with the
    # fallback.  `bash` is what every install WITHOUT cargo runs -- a TPM
    # install builds rust/ only when interdimux.tmux finds cargo -- and before
    # this leg the fallback ran only in the few places a suite forced it
    # (INTERDIMUX_USE_RUST=off), because a built binary is preferred
    # everywhere else.  That leg runs the shell suites
    # with IMUX_RENDERER=bash (tests/run_all.sh), which exports
    # INTERDIMUX_USE_RUST=off: the renderer path is then exactly a cargo-less
    # install's.  The binary is still BUILT there, because the suites that
    # compare the two renderers, and --doctor's helper checks, pin it on.
    #
    # The image is a matrix value, not `env`, because `runs-on` cannot read
    # `env`: this way one name feeds both runs-on and the cache keys, so a
    # cache built on one image is never restored onto another.  (actions/cache
    # versions an entry by its paths and compression only, not the image, and
    # a bash built against one image's libc is not proof the recipe works on
    # the next.)  The job's name leaves it out, to keep the two check names.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        renderer: [rust, bash]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fd-find at gawk locales strace \
            build-essential libevent-dev libncurses-dev bison pkg-config
          # strace: tests/test_render_cost.sh counts the bash renderer's
          # read(2) calls, the one measure of its cost a loaded runner cannot
          # blur.  Without it those cases skip.
          # A SECOND locale, whose collation differs from C's.  The parity suite
          # guards a real bug with it — the MRU sort used to order tied
          # timestamps by collation, so the two renderers disagreed on any
          # machine that was not in the C locale.  That guard probes for such a
          # locale and skips when there is none, and the runner image ships only
          # C and C.UTF-8: without this the regression test for a bug that
          # shipped quietly does not run at all.
          sudo locale-gen en_US.UTF-8
          # gawk, not the default mawk: several assertions measure a rendered row
          # in CELLS with awk's length(), and mawk counts BYTES — a five-glyph
          # rule measures 15 there.
          sudo update-alternatives --set awk /usr/bin/gawk

      - name: Cache tmux ${{ env.TMUX_VERSION }}
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: ~/tmux-prefix
          key: tmux-${{ env.TMUX_VERSION }}-${{ matrix.os }}

      - name: Build tmux ${{ env.TMUX_VERSION }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz" \
            -o /tmp/tmux.tar.gz
          tar -xzf /tmp/tmux.tar.gz -C /tmp
          cd "/tmp/tmux-${TMUX_VERSION}"
          ./configure --prefix="$HOME/tmux-prefix"
          make -j"$(nproc)"
          make install

      - name: Install fzf ${{ env.FZF_VERSION }}
        run: |
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz" \
            -o /tmp/fzf.tar.gz
          sudo tar -xzf /tmp/fzf.tar.gz -C /usr/local/bin

      # Real release binaries for tests/test_old_fzf.sh, which checks that the
      # navigator opens AND draws on fzf older than the pinned one.  Neither
      # failure it guards can be emulated with INTERDIMUX_FZF_MINOR on 0.74:
      # 0.44 refuses to start on an event it does not know, and 0.52 and older
      # draw the whole interface on stderr.  With INTERDIMUX_OLD_FZF_DIR set, a
      # version the suite names that is not here fails it, by name.
      #
      # fzf's release tags gained their `v` at 0.54.0: 0.53.0 and older are
      # tagged bare, and releases/download/v0.44.1/… is a 404 -- which, piped
      # into tar, failed this step as gzip's "unexpected end of file" and took
      # every suite after it down with it.  Downloaded to a file, a failed
      # fetch fails as curl, naming the URL.
      - name: Fetch old fzf releases
        run: |
          for v in $OLD_FZF_VERSIONS; do
            case $v in 0.[0-9].*|0.[0-4][0-9].*|0.5[0-3].*) tag=$v ;; *) tag=v$v ;; esac
            curl -fsSL --retry 3 -o "/tmp/fzf-$v.tar.gz" \
              "https://github.com/junegunn/fzf/releases/download/$tag/fzf-$v-linux_amd64.tar.gz"
            mkdir -p "$HOME/fzf-old/$v"
            tar -xzf "/tmp/fzf-$v.tar.gz" -C "$HOME/fzf-old/$v"
          done
          echo "INTERDIMUX_OLD_FZF_DIR=$HOME/fzf-old" >> "$GITHUB_ENV"

      # Real old bashes for tests/test_bash_floor.sh, which run_all.sh runs with
      # everything else: 3.2 and 4.2 must be refused in one line, and 4.3 to
      # 5.1 must list, search and survive `$` in names.  Built from source --
      # no apt route installs a second bash -- and cached by version and image,
      # so a push pays for this only when either changes.  The -std/-Wno flags
      # are for gcc 14 and later, which reject these K&R-era sources outright
      # (24.04's gcc 13 only warns), and they go to CFLAGS_FOR_BUILD as well:
      # 3.2's and 4.2's configure set that to a bare -g, and the helpers it
      # builds (mkbuiltins, ...) then meet gcc 15's C23 default, where `f()`
      # means `f(void)`, and fail.  CFLAGS deliberately has no -O2 (configure's
      # default): with it, 3.2's configure spins in its mktime probe, a loop
      # that relies on signed overflow wrapping.  See docs/CI.md §12.  Each goes
      # under its major.minor, cut from the tarball's name: `${v%.*}` made
      # "5.0" into "5", where the suite, which wants 5.0, would never look.
      - name: Cache bash ${{ env.OLD_BASH_VERSIONS }}
        id: old-bash-cache
        uses: actions/cache@v4
        with:
          path: ~/bash-old
          key: bash-old-${{ env.OLD_BASH_VERSIONS }}-${{ matrix.os }}

      - name: Build bash ${{ env.OLD_BASH_VERSIONS }}
        if: steps.old-bash-cache.outputs.cache-hit != 'true'
        run: |
          F="-std=gnu89 -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -Wno-incompatible-pointer-types"
          for v in $OLD_BASH_VERSIONS; do
            curl -fsSL --retry 3 -o "/tmp/bash-$v.tar.gz" "https://ftp.gnu.org/gnu/bash/bash-$v.tar.gz"
            tar -xzf "/tmp/bash-$v.tar.gz" -C /tmp
            cd "/tmp/bash-$v"
            if ! { ./configure --without-bash-malloc CFLAGS="$F" CFLAGS_FOR_BUILD="$F" \
                   && make -j"$(nproc)"; } > "/tmp/bash-$v.log" 2>&1; then
              tail -40 "/tmp/bash-$v.log"; exit 1
            fi
            d=$(echo "$v" | cut -d. -f1,2)
            mkdir -p "$HOME/bash-old/$d"
            cp bash "$HOME/bash-old/$d/bash"
            cd - >/dev/null
          done

      - name: Point the bash-floor suite at them
        run: echo "INTERDIMUX_OLD_BASH_DIR=$HOME/bash-old" >> "$GITHUB_ENV"

      - name: Put the built tmux first on PATH
        run: echo "$HOME/tmux-prefix/bin" >> "$GITHUB_PATH"

      - name: Start the at job-runner
        # Without it the schedule suites do not fail — they SKIP, and a skip
        # reporting "0 passed, 0 failed" is indistinguishable from coverage.
        run: sudo systemctl start atd || sudo service atd start

      # The old binaries too, so one that went missing fails here, by name,
      # before any suite runs.  (The suites that use them fail on a missing one
      # as well, now that the directories are set: their own lists are what
      # counts, and this step only knows the lists above.)
      - name: Versions under test
        run: |
          tmux -V
          fzf --version
          awk --version | head -1
          cargo --version
          locale charmap
          for v in $OLD_FZF_VERSIONS; do "$INTERDIMUX_OLD_FZF_DIR/$v/fzf" --version; done
          for v in $OLD_BASH_VERSIONS; do
            d=$(echo "$v" | cut -d. -f1,2)
            # shellcheck disable=SC2016  # $BASH_VERSION is the old bash's own
            "$INTERDIMUX_OLD_BASH_DIR/$d/bash" -c 'echo "bash $BASH_VERSION"'
          done

      - name: Build the Rust core
        # Without it every suite runs against the bash fallback and
        # test_rust_parity.sh — the one that guarantees the two renderers agree —
        # skips itself entirely.
        run: cargo build --release --manifest-path rust/Cargo.toml

      # Renderer-independent, so once is enough.
      - name: Rust tests
        if: matrix.renderer == 'rust'
        run: cargo test --release --manifest-path rust/Cargo.toml

      # run_all.sh, not a bare loop: it runs every suite even after one fails,
      # totals the assertions, and reports a suite that DIED without a Results
      # line as a failure rather than as silence.  A `for … bash "$t"` under
      # `bash -e` stops at the first failing suite and says nothing about the
      # other twenty.
      # IMUX_SKIP_RUST: run_all.sh runs `cargo test` itself when cargo is on
      # PATH, and it already ran as its own step above — where a failure is
      # attributed to Rust rather than buried in a shell-suite total.  It also
      # means this step's total EXCLUDES the Rust tests (docs/CI.md, "Reading
      # the totals", has the current numbers for both legs).  The bash leg's
      # total is lower again: test_rust_parity is skipped there.
      #
      # DO NOT "fix" a SIGPIPE failure here by wrapping this in
      # `env --default-signal=PIPE` or `perl -e '$SIG{PIPE}="DEFAULT"; exec @ARGV'`.
      # GitHub starts `run:` steps with SIGPIPE set to SIG_IGN, and SIG_IGN
      # survives execve, so every process the suite spawns inherits it — bash
      # cannot undo it, `trap - PIPE` is a no-op for a signal ignored at entry.
      # That is the ONLY place this project ever runs with SIGPIPE ignored, and
      # it is worth keeping: it is what caught the schedule dialog printing
      # 49,917 lines of "printf: write error: Broken pipe" over at's real
      # diagnostic (fixed in interdimux.sh, at the `sched_job_body` writer).
      # tests/test_pipefail.sh restores the default disposition for the one
      # assertion that genuinely needs it, and only for that assertion.
      - name: Shell tests
        run: IMUX_SKIP_RUST=1 IMUX_RENDERER=${{ matrix.renderer }} bash tests/run_all.sh
