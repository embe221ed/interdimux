[package]
name    = "imux"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "imux"
path = "src/main.rs"

[features]
macos-picker = ["dep:nucleo"]

[dependencies]
unicode-width = "0.1"
unicode-segmentation = "=1.12.0"
serde_json = "=1.0.145"
nucleo = { version = "=0.5.0", optional = true }

[patch.crates-io]
nucleo-matcher = { path = "vendor/nucleo-matcher" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[dev-dependencies]
unicode-width = "0.1"
